<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

            body {
                background-color: #1a1a1a;
                
            }
            .login {
                text-align: center;
                margin: 0 auto;
                width: min(400px, 90%);
                height: 400px;
                background-color: white;
                box-shadow: 0px 0px 20px 20px rgba(0, 0, 0, 1);
                border-radius: 20px;
                padding-bottom: 30px;
                padding-top: 10px;
            }

            .all {
                display: flex;
                align-items: center;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <div class="all">
        <div class="login">
            <h1>ログイン</h1>
            <label for="mail">メールアドレス: </label>
            <input type="email" id="mail" placeholder="(例: test@example.com)"><br>

            <label for="pass">パスワード: </label>
            <input type="password" id="pass" placeholder="パスワード">
            <p>アカウントを持っていない場合は: </p>
            <a href="signup.html">アカウント新規登録</a>
        </div>
        </div>
    </body>
</html>
