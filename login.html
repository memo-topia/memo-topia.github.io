<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

            body {
                background-color: #1a1a1a;
            }
            .login {
                text-align: center;
                margin: 0 auto;
                width: min(500px, 90%);
                height: 600px;
                background-color: white;
                box-shadow: 0px 0px 20px 20px rgba(0, 0, 0, 1);
                border-radius: 20px;
                padding: 15px;
            }
        </style>
    </head>
    <body>
        <div class="login">
            <h1>ログイン</h1>
            <label for="mail">メールアドレス: </label>
            <input type="email" id="mail" placeholder="(例: test@example.com)"><br>

            <label for="pass">パスワード: </label>
            <input type="password" id="pass" placeholder="パスワード">
        </div>
    </body>
</html>
