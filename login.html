<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン - メモトピア</title>
        <link rel="stylesheet" href="sign.css">
    </head>
    <body>
        <div class="all">
        <div class="login">
            <img src="ghost.png" id="ghost">
            <h1>ログイン</h1>
            <label for="mail">メールアドレス: </label>
            <input type="email" id="mail" placeholder="(例: test@example.com)"><br>

            <label for="pass">パスワード: </label>
            <input type="password" id="pass" placeholder="パスワード"><br>
            <input type="submit" value="確定" id="mit">
            <p>アカウントを持っていない場合は: </p>
            <a href="signup.html">アカウント新規登録</a>
        </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://cwvcpbgjxbyroqnsdctf.supabase.co"; 
const SUPABASE_KEY = "sb_publishable_WTjtS8YZ2P4HYtUibp3l0Q_-LwJ5GJp";
const client = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY );

            const mailInput = document.getElementById("mail");
            const passInput = document.getElementById("pass");
            const mit = document.getElementById("mit");

            mit.addEventListener("click", async () => {
                const mail = mailInput.value;
                const pass = passInput.value;

                if (mail == "" || pass == "") {
                    return alert("メールアドレスとパスワードを入力してください。");
                }

                const { data, error } = await client.auth.signInWithPassword({
                     email: mail,
                     password: pass
});
                if (error) {
                    return alert(error);
                }
            });
        </script>
</body>
</html>
